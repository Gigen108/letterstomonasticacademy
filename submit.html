<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit a Testimonial - Truth About Monastic Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Literata:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f5f3eb;
      --panel: #fffdf7;
      --ink: #2e3b2f;
      --sage: #556b55;
      --sage-soft: #6b7a6b;
      --hairline: rgba(85, 107, 85, 0.16);

      --font-reading: 'Literata', Georgia, 'Iowan Old Style', 'Times New Roman', serif;
      --font-label: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;

      --text-hero: clamp(2.5rem, 1.9rem + 3vw, 3.75rem);
      --text-dek: clamp(1.05rem, 0.98rem + 0.4vw, 1.25rem);
      --text-body: 1.1875rem;
      --text-nav: 0.9375rem;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-reading);
      font-size: var(--text-body);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.75;
      font-kerning: normal;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      background: var(--sage);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      gap: clamp(1.5rem, 4vw, 3rem);
      font-family: var(--font-label);
      font-size: var(--text-nav);
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    nav a {
      color: var(--paper);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.25s ease;
    }
    nav a:hover {
      border-bottom-color: rgba(245, 243, 235, 0.6);
    }

    .masthead {
      text-align: center;
      padding: clamp(3rem, 8vw, 5.5rem) 1.5rem 0;
    }
    .masthead h1 {
      margin: 0;
      font-weight: 600;
      font-size: var(--text-hero);
      line-height: 1.06;
      letter-spacing: -0.02em;
    }
    .masthead .dek {
      margin: 1.25rem auto 0;
      max-width: 34ch;
      font-size: var(--text-dek);
      font-style: italic;
      line-height: 1.5;
      color: var(--sage-soft);
    }

    .container {
      max-width: 44rem;
      margin: auto;
      padding: clamp(2.5rem, 6vw, 4rem) 1.5rem 4rem;
    }
    .airtable-wrap {
      position: relative;
      max-width: 720px;
      margin: 0 auto;
      min-height: 720px;
    }
    .airtable-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: var(--font-label);
      font-size: 0.9375rem;
      letter-spacing: 0.01em;
      color: var(--sage-soft);
      pointer-events: none;
    }
    .airtable-loading::before {
      content: "";
      width: 32px;
      height: 32px;
      border: 3px solid rgba(85, 107, 85, 0.2);
      border-top-color: var(--sage);
      border-radius: 50%;
      animation: airtable-spin 0.8s linear infinite;
    }
    @keyframes airtable-spin {
      to { transform: rotate(360deg); }
    }
    .airtable-embed {
      position: relative;
      display: block;
      width: 100%;
      border-radius: 6px;
      border: 1px solid var(--hairline);
      background: var(--panel);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .airtable-embed.loaded {
      opacity: 1;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="submit.html">Submit a Testimonial</a>
  </nav>

  <header class="masthead">
    <h1>Submit a Testimonial</h1>
    <p class="dek">Share your own experience at the Monastic Academy using the form below.</p>
  </header>

  <div class="container">
    <div class="contact-box">
      <div class="airtable-wrap">
        <div class="airtable-loading">Loading testimonial submission form…</div>
        <iframe class="airtable-embed" src="https://airtable.com/embed/app3KoZGg1uwP1RZn/paggXE2M3qvrBGusU/form?backgroundColor=transparent" frameborder="0" onmousewheel="" width="100%" height="720" style="background: transparent;" onload="this.classList.add('loaded')"></iframe>
      </div>
    </div>
  </div>

</body>
</html>
